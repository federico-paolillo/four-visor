services:
  memcached:
    command:
      [
        "memcached",
        "--port=65100",
        "--memory-limit=8",
        "--max-item-size=1m",
        "--disable-evictions",
      ]
    ports:
      - 127.0.0.1:65198:65100
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc -w 1 127.0.0.1 65100 | grep -q '^VERSION '"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

networks:
  cache:
    internal: false
