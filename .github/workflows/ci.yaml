name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install project tools
        uses: jdx/mise-action@v4.2.4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build backend
        run: mise run be:build

      - name: Test backend
        run: mise run be:test

      - name: Lint backend
        run: mise run be:lint

      - name: Build frontend
        run: mise run fe:build

      - name: Test frontend
        run: mise run fe:test

      - name: Lint frontend
        run: mise run fe:lint

      - name: Check frontend types
        run: mise run fe:check
