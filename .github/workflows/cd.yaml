name: CD

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve commit version
        id: commit
        run: echo "short=$(git rev-parse --short=12 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

      - name: Attest backend image
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@v7.3.0
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true

      - name: Attest frontend image
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build deployable archive
        id: archive
        env:
          SHORT_SHA: ${{ steps.commit.outputs.short }}
        run: |
          release_dir="dist/four-visor-$SHORT_SHA"
          archive="dist/four-visor-$SHORT_SHA.tar.gz"
          mkdir -p "$release_dir"
          cp Caddyfile otel-collector.yaml "$release_dir/"
          cp docker-compose.prod.yml.tpl "$release_dir/docker-compose.yaml"
          sed \
            -e "s/^FOURVISOR_COMMIT_HASH=.*/FOURVISOR_COMMIT_HASH=$GITHUB_SHA/" \
            -e "s/^FOURVISOR_IMAGE_TAG=.*/FOURVISOR_IMAGE_TAG=$SHORT_SHA/" \
            .env.example > "$release_dir/.env"
          tar -C dist -czf "$archive" "four-visor-$SHORT_SHA"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest deployable archive
        uses: actions/attest@v4.2.1
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.commit.outputs.short }}
        run: |
          gh release create "commit-$SHORT_SHA" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "four-visor $SHORT_SHA" \
            "${{ steps.archive.outputs.path }}"
