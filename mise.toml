[tools]
go = "1.26"
node = "26"
golangci-lint = "2.12"

[settings]
color = true

[tasks."be:lint"]
dir = "backend/"
run = "golangci-lint run"

[tasks."be:build"]
dir = "backend/"
run = "go build -v -o /dev/null ./..."

[tasks."be:test"]
dir = "backend/"
run = '''
set -eu
compose() {
  FOURVISOR_COMMIT_HASH=0000000000000000000000000000000000000000 \
    GRAFANA_CLOUD_OTLP_ENDPOINT=http://collector.invalid:65103 \
    GRAFANA_CLOUD_INSTANCE_ID=test-instance \
    GRAFANA_CLOUD_API_KEY=test-key \
    docker compose -p four-visor-test -f ../docker-compose.yml -f ../docker-compose.test.yml "$@"
}
cleanup() {
  compose down --remove-orphans >/dev/null 2>&1 || true
}
start_cache() {
  cleanup
  compose up --wait --wait-timeout 30 memcached
}
trap cleanup EXIT INT TERM
start_cache
FOURVISOR_TEST_MEMCACHED_ADDRESS=127.0.0.1:65198 \
  FOURVISOR_TEST_MEMCACHED_PRESSURE=0 \
  go test -p=1 -race -shuffle=on ./...
start_cache
FOURVISOR_TEST_MEMCACHED_ADDRESS=127.0.0.1:65198 \
  FOURVISOR_TEST_MEMCACHED_PRESSURE=1 \
  go test -race -count=1 -run '^TestMemcachedMemoryPressureCannotEvictActiveLineage$' ./lineage
'''
env = { CGO_ENABLED = 1 }

[tasks."fe:lint"]
dir = "frontend/"
run = "npm run lint"

[tasks."fe:check"]
dir = "frontend/"
run = "npm run typecheck"

[tasks."fe:build"]
dir = "frontend/"
run = "npm run build"

[tasks."fe:test"]
dir = "frontend/"
run = "npm run test"
